name: Build Extension & Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip Extension
        run: |
          cd reelgate
          zip -r ../checkpoint-extension.zip .
          cp ../checkpoint-extension.zip ../dist/checkpoint-extension.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd checkpoint-android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/checkpoint-android.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../checkpoint-android.apk

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Checkpoint-Extension
          path: checkpoint-extension.zip

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Checkpoint-Android-APK
          path: checkpoint-android.apk

      - name: Commit Built APK to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/checkpoint-android.apk dist/checkpoint-extension.zip
          git commit -m "Auto-build Android APK and Extension ZIP [skip ci]" || echo "No changes to commit"
          git push


      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Checkpoint Release v1.0.0"
          body: "Official Checkpoint Anti-Doomscroller release including Chrome/Edge Extension and Android APK."
          files: |
            checkpoint-android.apk
            checkpoint-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

